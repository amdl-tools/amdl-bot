name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.1'

      - name: Install ffmpeg
        # The thumbnail tests are skipped when ffmpeg is missing.
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Vet
        run: go vet ./...

      - name: Test
        if: matrix.os != 'macos-latest'
        run: go test -v ./...

      - name: Race detector (Telegram bot)
        if: matrix.os == 'ubuntu-latest'
        run: go test -race -count=1 ./internal/bot/...
